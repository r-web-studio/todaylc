services:
  - type: web
    name: tbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_URL
        sync: false
      - key: ADMIN_PASSWORD
        value: admin123
      - key: WEBHOOK_SECRET
        generateValue: true
